        <script>
    
    // countdown javascript

        let masked = "?£%&/()=^*+@#-_.:,;<>|RIPDIEGO"

        function randochar() {
            if (Math.random() < 0.7) {
                return masked[Math.floor(Math.random() * masked.length)]
            } else {
                return Math.floor(Math.random() * 10)
            }
        }

        function generate() {
            let str = ""
            for (let i=0;  i <= 15; i++) {
                str += randochar()
            }
            return str;
        }
        
        setInterval(() => {
                document.getElementById('countdown').innerHTML = generate()         
            },1000)
        
    </script>
